<!doctype html>
<!-- lang is a PLACEHOLDER here and the real value is set in boot() from the
     bootstrap payload's locale, because this file is served statically and
     has nothing to template it with. It drives font selection - see the
     :lang() rules in style.css - so it is set before applyStaticStrings
     draws anything, not left until the tape arrives. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroWire</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- STICKY, and one line. Reading weeks back is what this tool turned out
     to be for, and a Filter button pinned to the top of the document meant
     scrolling a hundred rows to reach it. Both controls live here now
     because both are controls.

     The ribbon deliberately does NOT stick: measured at 275px against a
     49px masthead, it is 34% of the viewport and answers a question you
     ask once at the start of a session. The sticky day headers do the
     orientation job for a backwards read at 30px instead. -->
<header id="masthead">
  <div class="mast-line">
    <span class="wordmark">MacroWire</span>
    <span class="clock" id="clock">--:--:--<span class="zone"> ---</span></span>
    <!-- VISIBLE WITHOUT BEING LOOKED FOR. Quiet in --chrome while every
         source is current; --fault the moment one is not. Never --accent:
         amber means unread and nothing else, and a health warning
         competing with the unread gutter would cost both of them. -->
    <button class="hbtn" id="health-open" aria-haspopup="dialog">
      <i class="hdot" id="health-dot"></i><span id="health-summary"></span>
    </button>
    <button class="fbtn" id="fopen" aria-expanded="false" aria-controls="fpanel">
      <span data-i18n="filter.button"></span> <kbd>f</kbd>
    </button>
    <span class="unread-total" id="unread-total"></span>
    <button class="fbtn" id="settings-open" data-i18n="settings.open"></button>
  </div>
  <!-- TWO QUESTIONS, TWO COSTS. The band below answers "how does the whole
       day lay out in my time", which is asked once at the start of a
       session and was charging 275px - plus ~45px of `no mark` legend - on
       every glance. This line answers the one asked on every glance: what
       is open now and what lands next. The band is still there behind `r`
       for the question it is actually good at. -->
  <div class="mast-strip" id="mast-strip" data-i18n-label="strip.aria"></div>
  <!-- THE MOST-USED AXIS, ALWAYS ON SCREEN. Jurisdiction cost `f`, find it
       in the panel, click, Esc - every time, for the filter reached for
       most. Seven chips is one line.
       These are the SAME chips as the panel's jurisdiction axis, not a
       copy of its state: both renders read one Set in state.f and share
       one click handler, so there is nothing to keep in sync.
       This row is UNCONDITIONAL. It used to be the tokens row, which hid
       itself when nothing was filtered; the chips are always here, so the
       tokens moved in beside them rather than keeping a second row that
       sometimes appears. `.tokens:empty::before` carries the empty
       case. -->
  <div class="mast-jur" id="mast-jur">
    <span class="jlab" data-i18n="filter.short.jurisdiction"></span>
    <div class="jchips" id="jur-chips"></div>
    <i class="jdiv"></i>
    <div class="tokens" id="tokens" aria-live="polite"></div>
    <button class="fclear" id="fclear"><span data-i18n="filter.clear"></span> <kbd>c</kbd></button>
  </div>
</header>

<!-- A native <dialog>, not another push-down drawer. Settings are modal in
     nature and filters are not: you adjust a filter WHILE watching the tape
     react, which is why that panel needed a height ceiling. You do not
     watch the tape while picking a timezone. showModal() also brings focus
     trapping, Esc-to-close, a backdrop and an inert background with no
     JavaScript - the same reasoning that made the filter axes <details>.
     And the drawer's height bug is unreachable here by construction. -->
<!-- The same shape as the settings dialog, for the same reasons it gives:
     showModal() brings focus trapping, Esc-to-close, a backdrop and an
     inert background with no JavaScript. The markup inside is the rail's
     health section moved WHOLE - the jurisdiction grouping, the
     network-wide note, and the stacked name-over-status that exists
     because a long status once squeezed a source name to zero width. -->
<dialog class="settings" id="health-dialog">
  <form method="dialog" class="settings-head">
    <h2 data-i18n="rail.health_heading"></h2>
    <button class="fbtn" value="close" data-i18n="settings.close"></button>
  </form>
  <div class="settings-body">
    <section>
      <div class="health" id="health"></div>
    </section>
    <section>
      <h3 data-i18n="rail.risk_heading"></h3>
      <div class="risk" id="risk"></div>
      <div class="risk" id="export-state"></div>
    </section>
  </div>
</dialog>

<dialog class="settings" id="settings">
  <form method="dialog" class="settings-head">
    <h2 data-i18n="settings.title"></h2>
    <button class="fbtn" value="close" data-i18n="settings.close"></button>
  </form>
  <div class="settings-body">
    <section>
      <h3 data-i18n="settings.viewer_heading"></h3>
      <p class="snote" data-i18n="settings.viewer_note"></p>
      <div class="sgrid" id="settings-viewer"></div>
    </section>
    <!-- Editing, not filtering. The filter panel shows only tickers that
         published in the window; this is where the list itself is kept,
         and the one place a holding can be added or removed. -->
    <section>
      <h3 data-i18n="settings.watchlist_heading"></h3>
      <p class="snote" data-i18n="settings.watchlist_note"></p>
      <div class="swl" id="settings-watchlist"></div>
    </section>
    <section>
      <h3 data-i18n="settings.install_heading"></h3>
      <p class="snote" id="settings-install-note"></p>
      <div class="sgrid ro" id="settings-install"></div>
    </section>
  </div>
  <datalist id="tz-all"></datalist>
</dialog>

<!-- HIDDEN IN THE MARKUP, not hidden by script after paint. The stored
     choice is read in boot() and the band is revealed if it says so, which
     means the closed case never draws and the open case draws once. The
     other order - visible by default, hidden on load - flashes 320px of
     chrome on every page load for a reader who keeps it shut. -->
<section class="ribbon" id="ribbon" data-i18n-label="app.aria_ribbon" hidden>
  <div class="ribbon-head">
    <span id="ribbon-day">—</span>
    <span id="ribbon-note" data-i18n="ribbon.note"></span>
  </div>
  <div class="band">
    <div class="hours" id="hours"></div>
    <div class="rows" id="sessions"></div>
    <div class="marks" id="marks"><div class="track" id="marks-track"></div></div>
    <div class="nowline" id="nowline" hidden></div>
  </div>
  <div class="untimed" id="untimed"></div>
</section>

<div class="note" id="firstrun" hidden></div>

<div class="body">
  <main>
    <div class="fpanel" id="fpanel" role="dialog" aria-modal="false"
         data-i18n-label="filter.aria_panel" hidden>
      <!-- The panel itself never scrolls; this does. Same split as the
           settings dialog: a scrolling body with the controls pinned
           outside it, so the way out is always on screen. -->
      <div class="fpanel-body" id="fpanel-body">
        <div class="fgrid" id="fgrid"></div>
      </div>
      <div class="fpanel-foot">
        <span class="fhint">
          <span data-i18n="filter.hint"></span>
          <span class="flegend" data-i18n="filter.legend"></span>
        </span>
        <button class="fbtn" id="fclose" data-i18n="filter.close"></button>
      </div>
    </div>
    <div class="tape" id="tape"><div class="note" data-i18n="app.loading"></div></div>
  </main>

  <aside class="rail">
    <h2 data-i18n="rail.cny_heading"></h2>
    <div class="fx" id="fx"></div>
    <div class="asof" id="fx-asof"></div>

    <h2 data-i18n="rail.sb_heading"></h2>
    <div class="fx" id="sb"></div>
    <div class="asof" id="sb-asof"></div>

    <h2 data-i18n="rail.cot_heading"></h2>
    <div class="fx" id="cot"></div>
    <div class="asof" id="cot-asof"></div>

    <h2 data-i18n="rail.ecb_heading"></h2>
    <div class="fx" id="ecb"></div>
    <div class="asof" id="ecb-asof"></div>

    <h2 data-i18n="rail.rba_heading"></h2>
    <div class="fx" id="rba"></div>
    <div class="asof" id="rba-asof"></div>
    <!-- Market series only. Health was the sixth of seven sections here,
         which meant a source that had gone quiet was something you had to
         SCROLL to discover - and a stale feed is exactly what makes an
         empty tape lie to you. It is in the masthead now. Risk and the
         export state went with it: they answer the same question about
         what is trustworthy, and they were below health. -->
  </aside>
</div>

<script src="/static/app.js"></script>
</body>
</html>
