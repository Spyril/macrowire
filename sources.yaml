# Every source MacroWire polls is defined here. Adding a source of an
# already-supported kind means adding a block below and nothing else.
#
# `parser` selects a handler from macrowire/parsers/. The two shipped
# handlers cover the two record types the RSS-CB 1.2 extension defines:
#
#   cb_news        -> RSS-CB cb:news items      -> rows in `items`
#   cb_statistics  -> RSS-CB cb:statistics items -> rows in `observations`
#   rss_news       -> plain RSS 2.0 items        -> rows in `items`
#   cfets_ccpr     -> CFETS CNY central parity    -> rows in `observations`
#   sec_edgar      -> SEC EDGAR company filings   -> rows in `items`
#   ecb_fx         -> ECB euro reference rates    -> rows in `observations`
#   cftc_cot       -> CFTC positioning, FX futures -> rows in `observations`
#
# `categories:` under a source maps URL substrings to a category name.
# It is applied by the pipeline, not by any parser, so it works for any
# feed whose payload does not classify its own entries.
#
# Only the RBA uses RSS-CB. Every other central bank verified so far
# publishes plain RSS 2.0 with no cb: namespace.
#
# A genuinely new *shape* of feed needs a new parser module; a new feed of
# an existing shape needs only YAML. See README, "Adding a source".
#
# ---------------------------------------------------------------------------
# THE DEFAULTS IN THIS FILE ARE OPINIONS, NOT NEUTRAL SETTINGS.
#
# They were chosen by one reader with one set of interests, and several of
# them will be wrong for you. They are all editable and none is load-bearing:
#
#   importance      Drives type scale in the tape - what shouts and what
#                   whispers. RBA media releases and the CFETS fix are 5;
#                   HKMA press releases are 2. That is a reading priority,
#                   not a fact about the sources.
#
#   staleness_days  When `status` says a source has gone quiet. Set only
#                   where a feed is genuinely daily; left off for sporadic
#                   ones, because a threshold that cries wolf gets ignored.
#
#   skip_forms      SEC forms not worth reading. Form 4 and 144 are insider
#                   transaction filings and were ~88% of volume across the
#                   watchlisted tickers - skipped because they are not acted
#                   on here. Empty the list to keep everything.
#
#   currencies      Which ECB pairs are stored. Eight majors, chosen for one
#                   person's holdings. The ECB publishes 29; unset this to
#                   take them all.
#
#   fx include/exclude
#                   Which items count as FX-relevant. These lists are
#                   editorial judgement - but unlike a topic taxonomy they
#                   have a TESTABLE ANCHOR: does this move a currency.
#                   "Bank Rate maintained at 3.75%" does; "PRA fines HDI
#                   Global SE" does not. Nobody needs to adjudicate that.
#
#                   THEY NEED MAINTENANCE. A vocabulary rots silently: when
#                   a source renames a committee, its items stop matching
#                   and drop out of the FX filter with no error. `status`
#                   reports the unclassified rate per source and flags a
#                   rise against the preceding period, so drift is visible
#                   rather than discovered by noticing an absence.
#
#                   An item matching neither list is UNCLASSIFIED, never
#                   not-FX, and unclassified is offered as a filter chip so
#                   anything missing from an FX view can still be found.
#
#   the source list itself
#                   Six of thirteen sources are AU, CN or HK. That is a
#                   point of view about which economies matter, not a
#                   default anyone should inherit unexamined. Adding a
#                   source is a YAML block; removing one is a deletion.
#
# ---------------------------------------------------------------------------
#
# `jurisdiction` is required on every source: AU US CN HK EU UK JP. It is a
# fact about the publisher, known at config time, so it carries no rules and
# cannot drift the way a topic taxonomy would.
#
# ${NAME} anywhere in a string is substituted from the environment at load
# time. An unset name is a hard error, never an empty string, so secrets
# stay out of this tracked file.

defaults:
  # Sent on every outbound request. RBA is a public government server.
  # Sent on every outbound request. These are public government servers and
  # they expect to know who is calling.
  #
  # MACROWIRE_CONTACT is required - config load fails without it, rather
  # than letting a nameless request reach a server that may block for it.
  # MACROWIRE_PROJECT_URL has a default: change it (or set the variable) if
  # you fork this, so your traffic identifies your project rather than the
  # canonical one.
  user_agent: "MacroWire/0.1 (personal news wire; +${MACROWIRE_PROJECT_URL:-https://github.com/Spyril/macrowire}; ${MACROWIRE_CONTACT})"
  # Floor on how often any one source may be polled. Enforced against
  # fetch_log, so it survives restarts. Values below 60 are rejected.
  min_interval_seconds: 60
  # Per-source, overridable under a source's config. 30s was too tight:
  # the NBS feeds are ~4.5MB and take ~50s to arrive, and a timeout
  # mid-download is exactly what produced a truncated, mojibaked feed.
  timeout_seconds: 120
  # Pause between sources within one cycle. Fetching is sequential, so
  # servers are never hit simultaneously anyway; this spaces them out
  # rather than firing nine back-to-back requests in under a second.
  stagger_seconds: 2
  # Days without a NEW item before `status` marks a source stale.
  # null = off. Staleness is INFORMATION only and never raises.
  staleness_days: null
  # Days to keep raw payloads for a source. null = keep forever, which is
  # the right default: for most feeds here the stored bytes are the only
  # copy that will ever exist. Set it ONLY where the payload is genuinely
  # re-fetchable. See README, "raw_responses retention".
  raw_retention_days: null

  # The interface. 127.0.0.1 only - this binds no other interface.
  # `serve` uses these unless --port / --host override for a one-off, and it
  # never falls back to a different port: a silently relocated server is how
  # you end up with three of them running.
  web:
    host: 127.0.0.1
    port: 8917

  # Where the irreplaceable rows are written. A few sources carry no
  # archive at all, so what this file holds is the only copy in existence.
  #
  # Point `path` at a synced folder - Dropbox, Nextcloud, an external drive -
  # and those rows are backed up automatically with no further action. Must
  # be absolute, and is checked for existence and writability at config load
  # rather than silently at export time.
  #
  # Left unset it writes to <repo>/export, which is a copy on the same disk
  # as the database and therefore protects against a mistake but not a dead
  # drive.
  export:
    # path: /home/you/Dropbox/macrowire
    auto: true

  # Automatic backups, taken by `fetch` rather than a separate cron entry.
  # Rationale: a second cron line is a second thing to forget, and the
  # thing being protected is partly unrecoverable. A backup only happens
  # when the cycle actually stored something new AND the newest existing
  # backup is older than interval_seconds - so an unchanged database is
  # not copied 26MB at a time for nothing.
  # Repeated identical titles from one source collapse into a single tape
  # row with a count. HKMA ships "Scam alert related to banks" 207 times -
  # 30% of its feed is one string. Collapsing is the fix; filtering is not.
  collapse_repeats: true

  backup:
    enabled: true
    interval_seconds: 86400   # at most one automatic backup per day
    keep: 7
    # Same rules as export.path: absolute, checked at config load. Left unset
    # backups sit in data/backups, on the same disk as the database - which
    # protects against a mistake but not a drive failure.
    # path: /home/you/Dropbox/macrowire-backups

sources:
  - name: rba_media_releases
    kind: cb_news
    parser: cb_news
    url: https://www.rba.gov.au/rss/rss-cb-media-releases.xml
    config:
      institution: RBA
      jurisdiction: AU
      fx:
        include:
          - "monetary polic"
          - "cash rate"
          - "interest rate"
          - "exchange rate"
          - "foreign exchange"
          - "swap agreement"
          - "reserves"
          - "board"
          - "statement on monetary"
        exclude:
          - "appointment"
          - "conference"
          - "museum"
          - "banknote"
          - "recruit"
      importance: 5
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # One-item window, no paging, no since parameter.
      # Every release collected from here on exists ONLY in this database.
      archive: none
      # This feed carries only the most recent release. Sporadic by
      # nature - multi-week gaps are normal, not a fault. Left off
      # deliberately; see README.
      staleness_days: null

  - name: rba_exchange_rates
    kind: cb_statistics
    parser: cb_statistics
    url: https://www.rba.gov.au/rss/rss-cb-exchange-rates.xml
    config:
      institution: RBA
      jurisdiction: AU
      # A reference series: FX by construction, no vocabulary needed.
      fx: true
      importance: 2
      # Publishes at a known clock time. Measured: single stamp, IQR 0m.
      timing:
        class: fixed
        at: "16:35"
        timezone: Australia/Sydney
        window_minutes: 0
      # Today's fixing only; yesterday's is already unreachable.
      archive: none
      # Published daily except public and bank holidays. 4 days absorbs
      # a long weekend. A daily feed going quiet IS a fault.
      staleness_days: 4

  # --- Federal Reserve -------------------------------------------------
  # Two feeds from the Board's own directory at /feeds/feeds.htm.
  # press_all is deliberately not polled: it overlaps press_monetary and
  # put duplicate FOMC minutes in the tape.
  # These carry <category>, which the parser prefers over the
  # announcement_type set here.
  #
  # Note: press_all and press_monetary genuinely overlap - a monetary
  # release appears in both. Dedupe is per source_id, so such a release
  # is stored once per feed. See README, "Overlapping feeds".
  - name: fed_press_monetary
    kind: rss_news
    parser: rss_news
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    config:
      institution: FED
      jurisdiction: US
      fx:
        include:
          - "FOMC"
          - "monetary polic"
          - "federal open market"
          - "discount rate"
          - "interest rate"
          - "policy rate"
          - "balance sheet"
          - "reserve requirement"
        exclude:
          - "enforcement action"
          - "banking application"
          - "consumer"
          - "community reinvestment"
      importance: 5
      # Scheduled with small spread. Ribbon draws a mark plus a window.
      timing:
        class: tight
        at: "14:00"
        timezone: America/New_York
        window_minutes: 30
      # 15-entry window, ~6 months.
      archive: rolling
      announcement_type: Monetary Policy
      staleness_days: null


  - name: fed_speeches
    kind: rss_news
    parser: rss_news
    url: https://www.federalreserve.gov/feeds/speeches.xml
    config:
      institution: FED
      jurisdiction: US
      fx:
        include:
          - "economic outlook"
          - "outlook"
          - "inflation"
          - "monetary polic"
          - "labor market"
          - "employment"
          - "global economic"
          - "economy"
          - "interest rate"
        exclude:
          - "regulation"
          - "regulatory"
          - "supervis"
          - "financial inclusion"
          - "innovation"
          - "cyber"
          - "community"
          - "welcome remarks"
          - "commencement"
      importance: 3
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # 15-entry window, ~2 months.
      archive: rolling
      announcement_type: Speech
      staleness_days: null

  # --- European Central Bank -------------------------------------------
  # From the ECB RSS directory. This is a combined feed: press releases,
  # speeches, interviews and Governing Council decisions all arrive here.
  # The ECB publishes no press-release-only feed. No <category> element,
  # so announcement_type below applies to every entry.
  - name: ecb_press
    kind: rss_news
    parser: rss_news
    url: https://www.ecb.europa.eu/rss/press.html
    config:
      institution: ECB
      jurisdiction: EU
      fx:
        include:
          - "monetary polic"
          - "interest rate"
          - "key ECB"
          - "governing council"
          - "inflation"
          - "euro area economy"
          - "consumer expectations"
          - "exchange rate"
          - "TARGET"
          - "economic bulletin"
          - "macroeconomic projection"
        exclude:
          - "concert"
          - "open air"
          - "payment method"
          - "digital euro"
          - "accessibility"
          - "supervis"
          - "climate"
          - "procurement"
          - "publication of"
          - "art "
      importance: 4
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # 15-entry window, ~4 weeks. Shallowest of the news feeds.
      archive: rolling
      announcement_type: ECB Press
      staleness_days: null
      # The feed carries no <category>, but the URL path distinguishes
      # the content types. First matching substring wins; anything
      # unmatched falls back to announcement_type above.
      categories:
        - match: /press/pr/
          name: Press Release
        - match: /press/key/
          name: Speech
        - match: /press/govcdec/
          name: Governing Council Decision
        - match: /press/inter/
          name: Interview
        - match: /press/press_conference/
          name: Press Conference

  # --- Bank of England --------------------------------------------------
  # From /rss. guid is an opaque GUID with isPermaLink="false" - stable
  # and unique, but not a URL; the link field carries the URL.
  - name: boe_news
    kind: rss_news
    parser: rss_news
    url: https://www.bankofengland.co.uk/rss/news
    config:
      institution: BOE
      jurisdiction: UK
      fx:
        include:
          - "Bank Rate"
          - "monetary polic"
          - "MPC"
          - "FXJSC"
          - "foreign exchange"
          - "money market"
          - "asset purchase"
          - "gilt sales"
          - "quantitative"
          - "inflation"
          - "financial policy committee"
          - "market notice"
          - "reserves"
        exclude:
          - "PRA"
          - "FCA"
          - "insurance"
          - "captive"
          - "friendly societ"
          - "enforcement"
          - "fine"
          - "consult"
          - "banknote"
          - "imagery"
          - "court of directors"
          - "AI Consortium"
          - "artificial intelligence"
          - "climate"
          - "appointment"
          - "appoints"
          - "levy"
          - "questionnaire"
          - "Critical Third Parties"
          - "letter from the governor"
          - "curriculum"
      importance: 3
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # 50-entry window, ~3 months.
      archive: rolling
      announcement_type: News
      staleness_days: null

  # --- Bank of Japan ----------------------------------------------------
  # The only English-language feed the BoJ publishes. It is a mixed
  # "What's New" stream - policy releases, statistics and research papers
  # together. There is no releases-only English feed. See README.
  - name: boj_whatsnew
    kind: rss_news
    parser: rss_news
    url: https://www.boj.or.jp/en/rss/whatsnew.xml
    config:
      institution: BOJ
      jurisdiction: JP
      fx:
        include:
          - "monetary polic"
          - "policy meeting"
          - "summary of opinions"
          - "outlook for economic"
          - "money stock"
          - "monetary base"
          - "market operations"
          - "bank of japan accounts"
          - "loans and bills"
          - "corporate goods price"
          - "consumption activity"
          - "real exports"
          - "real imports"
          - "principal figures"
          - "transactions with the government"
          - "current account"
          - "balance of payments"
          - "interest rate"
        exclude:
          - "research paper"
          - "BOJ Review"
          - "working paper"
          - "IMES"
          - "climate"
          - "survey concerning"
          - "public relations"
          - "museum"
          - "supply chain"
          - "productivity"
      importance: 3
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # 46-entry window, ~4 weeks.
      archive: rolling
      announcement_type: What's New
      staleness_days: null

  # --- Hong Kong Monetary Authority -------------------------------------
  # From the HKMA RSS directory at /eng/other-information/rss/.
  # Ships <guid/> empty on every entry, so identity falls back to link.
  # Carries a deep archive (~680 entries), unlike the RBA feeds.
  - name: hkma_press
    kind: rss_news
    parser: rss_news
    url: https://www.hkma.gov.hk/eng/other-information/rss/rss_press-release.xml
    config:
      institution: HKMA
      jurisdiction: HK
      fx:
        include:
          - "exchange fund"
          - "currency board"
          - "foreign currency reserve"
          - "international reserves"
          - "monetary polic"
          - "base rate"
          - "interest rate"
          - "renminbi"
          - "RMB"
          - "linked exchange rate"
          - "aggregate balance"
          - "discount window"
          - "Fed"
        exclude:
          - "scam"
          - "fraudulent"
          - "phishing"
          - "website alert"
          - "tender"
          - "issuance schedule"
          - "appointment"
          - "vacanc"
          - "recruit"
          - "credit card"
          - "complaints"
          - "coin collection"
          - "conference"
          - "climate"
          - "fintech"
          - "distributed ledger"
          - "regtech"
          - "insurance"
          - "consumer"
          - "bulletin"
          - "student"
          - "award"
      importance: 2
      # Feed carries a DATE, not a time - all 683 items stamped 00:00 HKT.
      # Ribbon gives it no time position at all.
      timing:
        class: date_only
      # 683-entry window, ~1 year.
      archive: rolling
      announcement_type: Press Release
      # Near-daily, and it is the Hong Kong source, so silence matters.
      staleness_days: 5

  # --- CFETS: CNY central parity fix ------------------------------------
  # Not a feed - a JSON API. The fix publishes at 09:15 China time on
  # each trading day and is the reference rate the onshore band is set
  # around.
  #
  # POSITIONAL ALIGNMENT IS THE RISK HERE. `records[].values` is a bare
  # array. It is NOT ordered by the currency parameter we send: the
  # server returns values in its own canonical order, the one given by
  # `data.head`, filtered to the pairs requested. Requesting
  # USD,AUD,HKD returns [USD, HKD, AUD]. Aligning by request order
  # silently files AUD's rate under HKD and vice versa, and both look
  # entirely plausible. The parser aligns against data.head and refuses
  # to guess. See README, "CFETS positional alignment".
  - name: cfets_ccpr
    kind: cfets_ccpr
    parser: cfets_ccpr
    url: https://www.chinamoney.com.cn/ags/ms/cm-u-bk-ccpr/CcprHisNew
    config:
      institution: CFETS
      jurisdiction: CN
      # A reference series: FX by construction, no vocabulary needed.
      fx: true
      importance: 5
      # Publishes at a known clock time. Measured: single stamp, IQR 0m.
      timing:
        class: fixed
        at: "09:15"
        timezone: Asia/Shanghai
        window_minutes: 0
      # Paginated history to at least 2015; fully re-pullable.
      archive: queryable
      # Polled only once this says a fix has actually published, rather
      # than on a clock assumption.
      publication_url: https://www.chinamoney.com.cn/r/cms/www/chinamoney/data/fx/ccpr.json
      # The fix is stamped in China Standard Time. Never inferred.
      timezone: "+08:00"
      # Server-side limits, both discovered by probing:
      #   a window of 365 days returns "只提供一年历史数据查询及下载"
      #   a pageSize above 50 returns HTTP 403
      window_days: 364
      page_size: 50
      backfill_start: "2020-01-01"
      # Seconds between backfill page requests. This is a bulk pull
      # against a server that owes us nothing.
      backfill_delay_seconds: 8
      # api_code is CFETS's own label and is what gets stored as `series`.
      # 100JPY/CNY is quoted per 100 yen; storing it under a rescaled
      # "JPY/CNY" label would mean silently altering a published official
      # rate, so the published form is kept.
      #
      # Bounds are sanity rails, not forecasts - wide enough to absorb a
      # decade of real moves, tight enough to catch a positional swap.
      # They are what turns an undetected mis-alignment into a raised
      # error: AUD at 4.81 landing under HKD (max 1.5) trips instantly.
      pairs:
        - api_code: USD/CNY
          min: 5.0
          max: 10.0
        - api_code: EUR/CNY
          min: 5.0
          max: 12.0
        - api_code: 100JPY/CNY
          min: 3.0
          max: 10.0
        - api_code: HKD/CNY
          min: 0.5
          max: 1.5
        - api_code: AUD/CNY
          min: 3.0
          max: 7.0

  # --- National Bureau of Statistics ------------------------------------
  # Two RSS 2.0 feeds, found in a 2023 site notice rather than any RSS
  # directory page. Plain rss_news handles them; only the timezone and
  # the size policy below are NBS-specific.
  #
  # These are the heaviest sources in the project by two orders of
  # magnitude: ~4.3MB each per poll, 500 entries, uncompressed on the
  # wire (stats.gov.cn sends no content-encoding). 92% of that payload is
  # full article text.
  #
  # pubDate arrives as a bare "2026-08-21 09:30:01" with NO offset. The
  # parser refuses to guess, so China Standard Time is declared here
  # explicitly. It is a fixed +08:00 year-round; the PRC observes no DST.
  - name: nbs_releases
    kind: rss_news
    parser: rss_news
    url: https://www.stats.gov.cn/sj/zxfb/rss.xml
    config:
      institution: NBS
      jurisdiction: CN
      fx:
        include:
          - "居民消费价格"
          - "工业生产者"
          - "采购经理"
          - "国民经济"
          - "国内生产总值"
          - "工业增加值"
          - "固定资产投资"
          - "社会消费品零售"
          - "进出口"
          - "工业企业利润"
          - "能源生产"
          - "产能利用率"
          - "生产资料市场价格"
          - "居民收入"
        exclude:
          - "早稻"
          - "夏粮"
          - "粮食产量"
          - "文化"
          - "体育"
          - "旅游"
          - "住宅销售价格"
          - "房地产"
      importance: 4
      # Scheduled with small spread. Ribbon draws a mark plus a window.
      timing:
        class: tight
        at: "09:30"
        timezone: Asia/Shanghai
        window_minutes: 30
      # 500-entry window, ~2.4 years.
      archive: rolling
      announcement_type: 数据发布
      timezone: "+08:00"
      # Daily-ish scheduled statistical releases, not a news wire. The
      # headline prints (CPI, PMI, GDP) land at 09:30 CST on published
      # dates. Four polls a day catches every one of them well inside the
      # trading day while keeping 4.3MB off the wire the other 20 hours.
      min_interval_seconds: 21600      # 6 hours
      timeout_seconds: 300             # ~50s observed; generous headroom
      # The full article text is kept in items.content, which dedupes.
      # The raw payload is a rolling 500-entry window that re-fetches
      # itself, so old copies are recoverable and need not be hoarded.
      raw_retention_days: 7
      staleness_days: null

  - name: nbs_interpretation
    kind: rss_news
    parser: rss_news
    url: https://www.stats.gov.cn/sj/sjjd/rss.xml
    config:
      institution: NBS
      jurisdiction: CN
      fx:
        include:
          - "居民消费价格"
          - "工业生产者"
          - "采购经理"
          - "国民经济"
          - "国内生产总值"
          - "工业增加值"
          - "固定资产投资"
          - "社会消费品零售"
          - "进出口"
          - "解读.*价格"
          - "解读.*工业"
          - "解读.*投资"
          - "解读.*消费"
          - "经济运行"
        exclude:
          - "成就系列报告"
          - "早稻"
          - "夏粮"
          - "文化"
          - "体育"
          - "旅游"
          - "乡村"
          - "农业强国"
          - "科技强国"
      importance: 3
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # 500-entry window, ~3.3 years.
      archive: rolling
      announcement_type: 数据解读
      timezone: "+08:00"
      min_interval_seconds: 21600
      timeout_seconds: 300
      raw_retention_days: 7
      staleness_days: null

  # --- SEC EDGAR: company filings, watchlist-driven -----------------------
  # One request per watchlisted US ticker against
  # data.sec.gov/submissions/CIK{10}.json. Polls NOTHING when the watchlist
  # is empty, which is the shipped state - a default watchlist would be a
  # guess about what someone holds.
  #
  # ACCESS: the SEC explicitly permits scripted access and publishes the
  # terms - 10 req/sec, and a User-Agent of the form "Name email". That
  # format is ENFORCED: a normal descriptive User-Agent was answered with
  # HTTP 403. sec_contact is required and its absence is a hard failure,
  # because polling in a way that gets the address blocked is worse than
  # not polling.
  - name: sec_edgar
    kind: sec_edgar
    parser: sec_edgar
    url: https://data.sec.gov/submissions/
    config:
      institution: SEC
      jurisdiction: US
      fx:
        exclude:
          - "8-K"
          - "10-Q"
          - "10-K"
          - "424B"
          - "SC 13"
          - "DEF"
          - "PX14A6G"
          - "SD"
          - "11-K"
          - "S-"
          - "144"
          - "3"
          - "4"
          - "FWP"
          - "EFFECT"
          - "POS"
          - "D"
      archive: queryable
      importance: 4
      # Filings arrive whenever a company files. No schedule to mark.
      timing:
        class: scattered
      announcement_type: Filing
      # Insider-transaction noise, skipped by default. Form 4 was 58% of
      # Apple's 1,001 most recent filings; Form 144 (proposed insider sale)
      # was a further 30% across the three watchlisted tickers. Matching is
      # exact, not a prefix - 424B2 is an unrelated prospectus form and is
      # kept. Empty this list to keep everything.
      skip_forms: [ "4", "4/A", "144", "144/A" ]
      # Well under the published 10/sec ceiling. We do not need the headroom.
      request_interval_seconds: 0.5
      # SEC's documented "Name email" form. Never hardcoded.
      sec_contact: "${SEC_CONTACT}"
      min_interval_seconds: 3600
      timeout_seconds: 120
      staleness_days: null

  # --- ECB euro foreign exchange reference rates --------------------------
  # Published directly by the ECB as gesmes/XML. Frankfurter and similar
  # services are convenience layers over this exact 1.5KB file, so there is
  # no reason to use one.
  #
  # Base is EUR, always: series read EUR/USD, EUR/JPY - target per one euro,
  # the same convention as the RBA (AUD base) and CFETS (CNY target). This
  # is a third reference series that happens to cover the majors, not a
  # localisation feature.
  #
  # The file carries a DATE and no time. The ECB publishes around 16:00 CET,
  # applied explicitly below and resolved per-instant so the CET/CEST switch
  # lands correctly.
  - name: ecb_fx
    kind: ecb_fx
    parser: ecb_fx
    url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
    config:
      institution: ECB
      jurisdiction: EU
      # A reference series: FX by construction, no vocabulary needed.
      fx: true
      # One request seeds ~64 trading days; older history is not offered by
      # this feed, so anything that scrolls off is not re-fetchable.
      archive: rolling
      importance: 2
      publication_time: "16:00"
      timezone: Europe/Berlin
      timing:
        class: fixed
        at: "16:00"
        timezone: Europe/Berlin
        window_minutes: 0
      # The majors. Leave `currencies` unset to store all 29 the ECB
      # publishes; these are the ones the rail shows.
      currencies: [ USD, JPY, GBP, CHF, AUD, CNY, HKD, CAD ]
      # A one-off seed: the same feed in a 90-day file, one request.
      # That file is erratically slow - three consecutive fetches of the same
      # 69KB took 40.6s, 25.7s and a timeout - while the daily file is
      # consistently fast. Hence the generous timeout; it is the server, not
      # the payload.
      backfill_url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist-90d.xml
      timeout_seconds: 300
      # Published once per business day; hourly polling is ample.
      min_interval_seconds: 3600
      staleness_days: 5

  # --- CFTC Commitments of Traders: FX futures positioning ---------------
  # Weekly. Non-commercial (speculative) longs and shorts in currency
  # futures - how the money is placed, and which way it moved. A kind of
  # information the tape cannot carry.
  #
  # US federal work, public domain. robots.txt sets Crawl-delay: 1 and
  # disallows only some browse paths; /resource/ is allowed.
  #
  # THE NET IS COMPUTED, AND DELIBERATELY SO. The payload has 133 fields,
  # twelve of them containing "net", and every one is a trader-concentration
  # ratio rather than the non-commercial net. See the comment at the top of
  # macrowire/parsers/cftc_cot.py before touching this.
  #
  # CONTRACTS ARE PINNED BY CODE. The dataset also carries -dormant, -OLD
  # and - SMALL variants plus a shelf of cross-rate contracts; matching on
  # name would produce a series that looks continuous while mixing
  # instruments. The `name` below is asserted against what the API returns,
  # so a reassigned code raises rather than silently changing what is
  # tracked.
  - name: cftc_cot
    kind: cftc_cot
    parser: cftc_cot
    url: https://publicreporting.cftc.gov/resource/6dca-aqww.json
    config:
      institution: CFTC
      jurisdiction: US
      # A reference series: FX by construction, no vocabulary needed.
      fx: true
      archive: queryable
      importance: 3
      timezone: America/New_York
      timing:
        class: fixed
        at: "15:30"
        timezone: America/New_York
        window_minutes: 0
      # Crawl-delay: 1, from their robots.txt.
      request_interval_seconds: 1.0
      page_size: 200
      # Full history is 13,767 rows back to 1986; 5,000 a page is 3 requests.
      backfill_page_size: 5000
      contracts:
        - { code: "232741", currency: AUD, name: "AUSTRALIAN DOLLAR" }
        - { code: "097741", currency: JPY, name: "JAPANESE YEN" }
        - { code: "099741", currency: EUR, name: "EURO FX" }
        - { code: "096742", currency: GBP, name: "BRITISH POUND" }
        - { code: "092741", currency: CHF, name: "SWISS FRANC" }
        - { code: "090741", currency: CAD, name: "CANADIAN DOLLAR" }
        - { code: "112741", currency: NZD, name: "NZ DOLLAR" }
        - { code: "098662", currency: DXY, name: "USD INDEX" }
      min_interval_seconds: 3600
      timeout_seconds: 180
      staleness_days: 14
