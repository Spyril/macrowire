# Every source MacroWire polls is defined here. Adding a source of an
# already-supported kind means adding a block below and nothing else.
#
# `parser` selects a handler from macrowire/parsers/. The two shipped
# handlers cover the two record types the RSS-CB 1.2 extension defines:
#
#   cb_news        -> RSS-CB cb:news items      -> rows in `items`
#   cb_statistics  -> RSS-CB cb:statistics items -> rows in `observations`
#   rss_news       -> plain RSS 2.0 items        -> rows in `items`
#   cfets_ccpr     -> CFETS CNY central parity    -> rows in `observations`
#
# `categories:` under a source maps URL substrings to a category name.
# It is applied by the pipeline, not by any parser, so it works for any
# feed whose payload does not classify its own entries.
#
# Only the RBA uses RSS-CB. Every other central bank verified so far
# publishes plain RSS 2.0 with no cb: namespace.
#
# A genuinely new *shape* of feed needs a new parser module; a new feed of
# an existing shape needs only YAML. See README, "Adding a source".
#
# `jurisdiction` is required on every source: AU US CN HK EU UK JP. It is a
# fact about the publisher, known at config time, so it carries no rules and
# cannot drift the way a topic taxonomy would.
#
# ${NAME} anywhere in a string is substituted from the environment at load
# time. An unset name is a hard error, never an empty string, so secrets
# stay out of this tracked file.

defaults:
  # Sent on every outbound request. RBA is a public government server.
  user_agent: "MacroWire/0.1 (personal news wire; +https://github.com/Spyril/macrowire; ${MACROWIRE_CONTACT})"
  # Floor on how often any one source may be polled. Enforced against
  # fetch_log, so it survives restarts. Values below 60 are rejected.
  min_interval_seconds: 60
  # Per-source, overridable under a source's config. 30s was too tight:
  # the NBS feeds are ~4.5MB and take ~50s to arrive, and a timeout
  # mid-download is exactly what produced a truncated, mojibaked feed.
  timeout_seconds: 120
  # Pause between sources within one cycle. Fetching is sequential, so
  # servers are never hit simultaneously anyway; this spaces them out
  # rather than firing nine back-to-back requests in under a second.
  stagger_seconds: 2
  # Days without a NEW item before `status` marks a source stale.
  # null = off. Staleness is INFORMATION only and never raises.
  staleness_days: null
  # Days to keep raw payloads for a source. null = keep forever, which is
  # the right default: for most feeds here the stored bytes are the only
  # copy that will ever exist. Set it ONLY where the payload is genuinely
  # re-fetchable. See README, "raw_responses retention".
  raw_retention_days: null

  # The interface. 127.0.0.1 only - this binds no other interface.
  # `serve` uses these unless --port / --host override for a one-off, and it
  # never falls back to a different port: a silently relocated server is how
  # you end up with three of them running.
  web:
    host: 127.0.0.1
    port: 8917

  # Automatic backups, taken by `fetch` rather than a separate cron entry.
  # Rationale: a second cron line is a second thing to forget, and the
  # thing being protected is partly unrecoverable. A backup only happens
  # when the cycle actually stored something new AND the newest existing
  # backup is older than interval_seconds - so an unchanged database is
  # not copied 26MB at a time for nothing.
  # Repeated identical titles from one source collapse into a single tape
  # row with a count. HKMA ships "Scam alert related to banks" 207 times -
  # 30% of its feed is one string. Collapsing is the fix; filtering is not.
  collapse_repeats: true

  backup:
    enabled: true
    interval_seconds: 86400   # at most one automatic backup per day
    keep: 7

sources:
  - name: rba_media_releases
    kind: cb_news
    parser: cb_news
    url: https://www.rba.gov.au/rss/rss-cb-media-releases.xml
    config:
      institution: RBA
      jurisdiction: AU
      importance: 5
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # One-item window, no paging, no since parameter.
      # Every release collected from here on exists ONLY in this database.
      archive: none
      # This feed carries only the most recent release. Sporadic by
      # nature - multi-week gaps are normal, not a fault. Left off
      # deliberately; see README.
      staleness_days: null

  - name: rba_exchange_rates
    kind: cb_statistics
    parser: cb_statistics
    url: https://www.rba.gov.au/rss/rss-cb-exchange-rates.xml
    config:
      institution: RBA
      jurisdiction: AU
      importance: 2
      # Publishes at a known clock time. Measured: single stamp, IQR 0m.
      timing:
        class: fixed
        at: "16:35"
        timezone: Australia/Sydney
        window_minutes: 0
      # Today's fixing only; yesterday's is already unreachable.
      archive: none
      # Published daily except public and bank holidays. 4 days absorbs
      # a long weekend. A daily feed going quiet IS a fault.
      staleness_days: 4

  # --- Federal Reserve -------------------------------------------------
  # Two feeds from the Board's own directory at /feeds/feeds.htm.
  # press_all is deliberately not polled: it overlaps press_monetary and
  # put duplicate FOMC minutes in the tape.
  # These carry <category>, which the parser prefers over the
  # announcement_type set here.
  #
  # Note: press_all and press_monetary genuinely overlap - a monetary
  # release appears in both. Dedupe is per source_id, so such a release
  # is stored once per feed. See README, "Overlapping feeds".
  - name: fed_press_monetary
    kind: rss_news
    parser: rss_news
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    config:
      institution: FED
      jurisdiction: US
      importance: 5
      # Scheduled with small spread. Ribbon draws a mark plus a window.
      timing:
        class: tight
        at: "14:00"
        timezone: America/New_York
        window_minutes: 30
      # 15-entry window, ~6 months.
      archive: rolling
      announcement_type: Monetary Policy
      staleness_days: null


  - name: fed_speeches
    kind: rss_news
    parser: rss_news
    url: https://www.federalreserve.gov/feeds/speeches.xml
    config:
      institution: FED
      jurisdiction: US
      importance: 3
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # 15-entry window, ~2 months.
      archive: rolling
      announcement_type: Speech
      staleness_days: null

  # --- European Central Bank -------------------------------------------
  # From the ECB RSS directory. This is a combined feed: press releases,
  # speeches, interviews and Governing Council decisions all arrive here.
  # The ECB publishes no press-release-only feed. No <category> element,
  # so announcement_type below applies to every entry.
  - name: ecb_press
    kind: rss_news
    parser: rss_news
    url: https://www.ecb.europa.eu/rss/press.html
    config:
      institution: ECB
      jurisdiction: EU
      importance: 4
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # 15-entry window, ~4 weeks. Shallowest of the news feeds.
      archive: rolling
      announcement_type: ECB Press
      staleness_days: null
      # The feed carries no <category>, but the URL path distinguishes
      # the content types. First matching substring wins; anything
      # unmatched falls back to announcement_type above.
      categories:
        - match: /press/pr/
          name: Press Release
        - match: /press/key/
          name: Speech
        - match: /press/govcdec/
          name: Governing Council Decision
        - match: /press/inter/
          name: Interview
        - match: /press/press_conference/
          name: Press Conference

  # --- Bank of England --------------------------------------------------
  # From /rss. guid is an opaque GUID with isPermaLink="false" - stable
  # and unique, but not a URL; the link field carries the URL.
  - name: boe_news
    kind: rss_news
    parser: rss_news
    url: https://www.bankofengland.co.uk/rss/news
    config:
      institution: BOE
      jurisdiction: UK
      importance: 3
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # 50-entry window, ~3 months.
      archive: rolling
      announcement_type: News
      staleness_days: null

  # --- Bank of Japan ----------------------------------------------------
  # The only English-language feed the BoJ publishes. It is a mixed
  # "What's New" stream - policy releases, statistics and research papers
  # together. There is no releases-only English feed. See README.
  - name: boj_whatsnew
    kind: rss_news
    parser: rss_news
    url: https://www.boj.or.jp/en/rss/whatsnew.xml
    config:
      institution: BOJ
      jurisdiction: JP
      importance: 3
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # 46-entry window, ~4 weeks.
      archive: rolling
      announcement_type: What's New
      staleness_days: null

  # --- Hong Kong Monetary Authority -------------------------------------
  # From the HKMA RSS directory at /eng/other-information/rss/.
  # Ships <guid/> empty on every entry, so identity falls back to link.
  # Carries a deep archive (~680 entries), unlike the RBA feeds.
  - name: hkma_press
    kind: rss_news
    parser: rss_news
    url: https://www.hkma.gov.hk/eng/other-information/rss/rss_press-release.xml
    config:
      institution: HKMA
      jurisdiction: HK
      importance: 2
      # Feed carries a DATE, not a time - all 683 items stamped 00:00 HKT.
      # Ribbon gives it no time position at all.
      timing:
        class: date_only
      # 683-entry window, ~1 year.
      archive: rolling
      announcement_type: Press Release
      # Near-daily, and it is the Hong Kong source, so silence matters.
      staleness_days: 5

  # --- CFETS: CNY central parity fix ------------------------------------
  # Not a feed - a JSON API. The fix publishes at 09:15 China time on
  # each trading day and is the reference rate the onshore band is set
  # around.
  #
  # POSITIONAL ALIGNMENT IS THE RISK HERE. `records[].values` is a bare
  # array. It is NOT ordered by the currency parameter we send: the
  # server returns values in its own canonical order, the one given by
  # `data.head`, filtered to the pairs requested. Requesting
  # USD,AUD,HKD returns [USD, HKD, AUD]. Aligning by request order
  # silently files AUD's rate under HKD and vice versa, and both look
  # entirely plausible. The parser aligns against data.head and refuses
  # to guess. See README, "CFETS positional alignment".
  - name: cfets_ccpr
    kind: cfets_ccpr
    parser: cfets_ccpr
    url: https://www.chinamoney.com.cn/ags/ms/cm-u-bk-ccpr/CcprHisNew
    config:
      institution: CFETS
      jurisdiction: CN
      importance: 5
      # Publishes at a known clock time. Measured: single stamp, IQR 0m.
      timing:
        class: fixed
        at: "09:15"
        timezone: Asia/Shanghai
        window_minutes: 0
      # Paginated history to at least 2015; fully re-pullable.
      archive: queryable
      # Polled only once this says a fix has actually published, rather
      # than on a clock assumption.
      publication_url: https://www.chinamoney.com.cn/r/cms/www/chinamoney/data/fx/ccpr.json
      # The fix is stamped in China Standard Time. Never inferred.
      timezone: "+08:00"
      # Server-side limits, both discovered by probing:
      #   a window of 365 days returns "只提供一年历史数据查询及下载"
      #   a pageSize above 50 returns HTTP 403
      window_days: 364
      page_size: 50
      backfill_start: "2020-01-01"
      # Seconds between backfill page requests. This is a bulk pull
      # against a server that owes us nothing.
      backfill_delay_seconds: 8
      # api_code is CFETS's own label and is what gets stored as `series`.
      # 100JPY/CNY is quoted per 100 yen; storing it under a rescaled
      # "JPY/CNY" label would mean silently altering a published official
      # rate, so the published form is kept.
      #
      # Bounds are sanity rails, not forecasts - wide enough to absorb a
      # decade of real moves, tight enough to catch a positional swap.
      # They are what turns an undetected mis-alignment into a raised
      # error: AUD at 4.81 landing under HKD (max 1.5) trips instantly.
      pairs:
        - api_code: USD/CNY
          min: 5.0
          max: 10.0
        - api_code: EUR/CNY
          min: 5.0
          max: 12.0
        - api_code: 100JPY/CNY
          min: 3.0
          max: 10.0
        - api_code: HKD/CNY
          min: 0.5
          max: 1.5
        - api_code: AUD/CNY
          min: 3.0
          max: 7.0

  # --- National Bureau of Statistics ------------------------------------
  # Two RSS 2.0 feeds, found in a 2023 site notice rather than any RSS
  # directory page. Plain rss_news handles them; only the timezone and
  # the size policy below are NBS-specific.
  #
  # These are the heaviest sources in the project by two orders of
  # magnitude: ~4.3MB each per poll, 500 entries, uncompressed on the
  # wire (stats.gov.cn sends no content-encoding). 92% of that payload is
  # full article text.
  #
  # pubDate arrives as a bare "2026-08-21 09:30:01" with NO offset. The
  # parser refuses to guess, so China Standard Time is declared here
  # explicitly. It is a fixed +08:00 year-round; the PRC observes no DST.
  - name: nbs_releases
    kind: rss_news
    parser: rss_news
    url: https://www.stats.gov.cn/sj/zxfb/rss.xml
    config:
      institution: NBS
      jurisdiction: CN
      importance: 4
      # Scheduled with small spread. Ribbon draws a mark plus a window.
      timing:
        class: tight
        at: "09:30"
        timezone: Asia/Shanghai
        window_minutes: 30
      # 500-entry window, ~2.4 years.
      archive: rolling
      announcement_type: 数据发布
      timezone: "+08:00"
      # Daily-ish scheduled statistical releases, not a news wire. The
      # headline prints (CPI, PMI, GDP) land at 09:30 CST on published
      # dates. Four polls a day catches every one of them well inside the
      # trading day while keeping 4.3MB off the wire the other 20 hours.
      min_interval_seconds: 21600      # 6 hours
      timeout_seconds: 300             # ~50s observed; generous headroom
      # The full article text is kept in items.content, which dedupes.
      # The raw payload is a rolling 500-entry window that re-fetches
      # itself, so old copies are recoverable and need not be hoarded.
      raw_retention_days: 7
      staleness_days: null

  - name: nbs_interpretation
    kind: rss_news
    parser: rss_news
    url: https://www.stats.gov.cn/sj/sjjd/rss.xml
    config:
      institution: NBS
      jurisdiction: CN
      importance: 3
      # No usable schedule (IQR 2-7h measured). Ribbon draws NOTHING - a
      # fixed mark here would be inventing precision the data does not have.
      timing:
        class: scattered
      # 500-entry window, ~3.3 years.
      archive: rolling
      announcement_type: 数据解读
      timezone: "+08:00"
      min_interval_seconds: 21600
      timeout_seconds: 300
      raw_retention_days: 7
      staleness_days: null
